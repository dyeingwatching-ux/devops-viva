name: CI/CD Pipeline

on:
    push:
        branches: ["main"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run tests
              run: pytest test_app.py

    build-and-push:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: wanathejonty/csi2113-app:latest

    deploy-local:
        needs: build-and-push
        runs-on: self-hosted
        steps:
            - name: Pull latest image and restart Docker Compose
              run: |
                  docker compose pull
                  docker compose down
                  docker compose up -d
